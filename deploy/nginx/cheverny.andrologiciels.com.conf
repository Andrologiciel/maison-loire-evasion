server {
    listen 80;
    listen [::]:80;

    server_name cheverny.andrologiciels.com www.cheverny.andrologiciels.com;

    return 301 https://$host$request_uri;
}

server {
    # Syntaxe compatible avec NGINX 1.24 installé sur le VPS.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name cheverny.andrologiciels.com www.cheverny.andrologiciels.com;

    ssl_certificate /var/www/CERT/fullchain.crt;
    ssl_certificate_key /var/www/CERT/ionosandrologiciels.key;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    # Le fichier Decap doit toujours être relu après une modification.
    location = /admin/config.yml {
        proxy_pass http://127.0.0.1:3000/admin/config.yml;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
